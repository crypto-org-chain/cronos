# 1-validator batch-simple-transfer workload with one nonce-0 sender per
# transaction. Generates the same 960000 transfers as
# 1val-batch-simple-transfer.yaml - matching counts are what make the pair a
# valid control - while removing same-account dependency chains from BlockSTM.
# Costs 960000 genesis-funded physical senders (num_accounts * num_txs).
endpoints:
  - name: node0
    rpc: http://127.0.0.1:26657
    json_rpc: http://127.0.0.1:26651
mode: cosmos
chain_id: 777
evm_denom: basetcro
gas_price: 5000000000000
global_seq: 0
tx_type: simple-transfer
msg_version: "1.4"
num_accounts: 8000
num_txs: 120
sender_strategy: unique-per-tx
batch_size: 100
send_batch_size: 8000
send_interval: 0.05

# Batch envelopes saturate every block, so this workload needs tens of blocks
# rather than the handful an unbatched run needs; the 120s default expires
# mid-run and reports a partial commit count as a failure.
commit_timeout: 600
