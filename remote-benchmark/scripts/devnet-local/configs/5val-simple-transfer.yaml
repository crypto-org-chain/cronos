# 5-validator local devnet - simple-transfer (single MsgEthereumTx per tx).
# Reference: https://github.com/crypto-org-chain/cronos/wiki/V1.4-Benchmark
# ("5 Validators" table) - target ~7965 TPS on an M4 MacBook Pro.
# The wiki lists no separate options for 5 validators. num_accounts/num_txs are
# widened past the 3-validator case (10000 x 10) to 20000 x 15, so the load
# still saturates blocks once it is spread across five proposers.
endpoints:
  - name: node0
    rpc: http://127.0.0.1:26657
    json_rpc: http://127.0.0.1:26651
    node_config: {mempool.type: app}
  - name: node1
    rpc: http://127.0.0.1:26667
    json_rpc: http://127.0.0.1:26661
    node_config: {mempool.type: app}
  - name: node2
    rpc: http://127.0.0.1:26677
    json_rpc: http://127.0.0.1:26671
    node_config: {mempool.type: app}
  - name: node3
    rpc: http://127.0.0.1:26687
    json_rpc: http://127.0.0.1:26681
    node_config: {mempool.type: app}
  - name: node4
    rpc: http://127.0.0.1:26697
    json_rpc: http://127.0.0.1:26691
    node_config: {mempool.type: app}
# node0's dedicated Prometheus port (see benchmark-5val.jsonnet's per-validator
# instrumentation.prometheus_listen_addr override) - the shared ':9090' in the
# base config collides across all 5 nodes on 127.0.0.1, so only node0's port
# is reliably scrapable.
telemetry: http://127.0.0.1:26659
# node0's API server (pystarport's api_port = base_port+4) - serves cosmos-sdk's
# own tx_count/tx_successful/tx_failed and cronos's mempool telemetry at
# /metrics?format=prometheus, separate from CometBFT's :26659 above.
sdk_metrics: http://127.0.0.1:26654
mode: cosmos
chain_id: 777
evm_denom: basetcro
gas_price: 5000000000000
global_seq: 0
tx_type: simple-transfer
msg_version: "1.4"
num_accounts: 20000
num_txs: 15
# One fresh sender per tx. Reusing a sender for 15 sequential nonces made
# ~13-29% of txs die at DeliverTx with sdk:3 (invalid sequence): gossip gives
# no cross-envelope ordering, so a proposer can see nonce N+1 before N, and
# PrepareProposal does no ante re-check to catch it. Distinct senders remove
# the nonce ordering the chain fails to preserve. Costs 300000 genesis-funded
# physical senders (num_accounts * num_txs).
sender_strategy: unique-per-tx
# No warmup_txs here: warm-up needs a sender range disjoint from the measured
# load, which unique-per-tx has none of, so the runner skips it.
batch_size: 1
send_batch_size: 20000
send_interval: 0.2
