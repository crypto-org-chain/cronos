# 1-validator local devnet - simple-transfer (single MsgEthereumTx per tx).
# Reference: https://github.com/crypto-org-chain/cronos/wiki/V1.4-Benchmark
# ("1 Validator" table) - target ~12088 TPS on an M4 MacBook Pro.
# num_accounts/num_txs match the wiki's options for this case exactly.
endpoints:
  - name: node0
    rpc: http://127.0.0.1:26657
    json_rpc: http://127.0.0.1:26651
mode: cosmos
chain_id: 777
evm_denom: basetcro
gas_price: 5000000000000
global_seq: 0
tx_type: simple-transfer
msg_version: "1.4"
num_accounts: 8000
num_txs: 40
batch_size: 1
send_batch_size: 8000
send_interval: 0.05
