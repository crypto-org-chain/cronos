# 3-validator local devnet - batch-erc20-transfer (100 MsgEthereumTx per
# cosmos tx, each calling the predeployed ERC20 contract). Reference target:
# ~9805 TPS on an M4 MacBook Pro (wiki "3 Validators" table).
# num_accounts/num_txs/batch_size match the wiki's options exactly.
# Requires patch_erc20_genesis.py to have run with --num-accounts >=
# num_accounts below.
endpoints:
  - name: node0
    rpc: http://127.0.0.1:26657
    json_rpc: http://127.0.0.1:26651
  - name: node1
    rpc: http://127.0.0.1:26667
    json_rpc: http://127.0.0.1:26661
  - name: node2
    rpc: http://127.0.0.1:26677
    json_rpc: http://127.0.0.1:26671
mode: cosmos
chain_id: 777
evm_denom: basetcro
gas_price: 5000000000000
global_seq: 0
tx_type: erc20-transfer
msg_version: "1.4"
num_accounts: 2400
num_txs: 100
batch_size: 100
send_batch_size: 2400
send_interval: 0.2

# Batch envelopes saturate every block, so this workload needs tens of blocks
# rather than the handful an unbatched run needs; the 120s default expires
# mid-run and reports a partial commit count as a failure.
commit_timeout: 600
