# 1-validator local devnet - nft-mint (every tx mints against the shared
# MintCounter contract, contending on its totalMinted storage slot).
# Requires patch_erc20_genesis.py to have run so the nft contract is seeded.
endpoints:
  - name: node0
    rpc: http://127.0.0.1:26657
    json_rpc: http://127.0.0.1:26651
mode: cosmos
chain_id: 777
evm_denom: basetcro
gas_price: 5000000000000
global_seq: 0
tx_type: nft-mint
msg_version: "1.4"
num_accounts: 8000
num_txs: 40
batch_size: 1
send_batch_size: 8000
send_interval: 0.05
