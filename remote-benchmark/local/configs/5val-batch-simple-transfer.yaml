# 5-validator local devnet - batch-simple-transfer (100 MsgEthereumTx per
# cosmos tx). Reference target: ~10822 TPS on an M4 MacBook Pro (wiki
# "5 Validators" table, "Batch Simple Transfer (100 size)").
# num_accounts/num_txs/batch_size match the 3-validator case (wiki lists no
# separate options for 5 validators).
endpoints:
  - name: node0
    rpc: http://127.0.0.1:26657
    json_rpc: http://127.0.0.1:26651
  - name: node1
    rpc: http://127.0.0.1:26667
    json_rpc: http://127.0.0.1:26661
  - name: node2
    rpc: http://127.0.0.1:26677
    json_rpc: http://127.0.0.1:26671
  - name: node3
    rpc: http://127.0.0.1:26687
    json_rpc: http://127.0.0.1:26681
  - name: node4
    rpc: http://127.0.0.1:26697
    json_rpc: http://127.0.0.1:26691
mode: cosmos
chain_id: 777
evm_denom: basetcro
gas_price: 5000000000000
global_seq: 0
tx_type: simple-transfer
msg_version: "1.4"
num_accounts: 8000
num_txs: 100
batch_size: 100
send_batch_size: 8000
send_interval: 0.2

# Batch envelopes saturate every block, so this workload needs tens of blocks
# rather than the handful an unbatched run needs; the 120s default expires
# mid-run and reports a partial commit count as a failure.
commit_timeout: 600
