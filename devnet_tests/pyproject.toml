[tool.poetry]
name = "devnet-tests"
version = "0.1.0"
description = "Functional test suite against remote, already-running Cronos devnets"
authors = ["chain-dev <chain@crypto.com>"]

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^8.0"
pydantic = "^2"
pyyaml = "^6"
web3 = "^7.13.0"
click = "^8.1.7"
eth-account = "^0.13"
requests = "^2.31"

[tool.poetry.group.dev.dependencies]
black = "^24.3"
flake8 = "^7.0"
flake8-black = "^0.3"
flake8-isort = "^6.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
devnet-tests = "devnet_tests.rpc_diff:cli"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
